<table class="table" cdkDropListGroup>
  <thead>
    <tr>
      @for (position of positionen; track position) {
      <th scope="col">
        <div class="align-items-center">
          <span>{{ position | titlecase }}</span> <!--titelcase macht schreibt postionsanbagen automatisch gross-->
          <button type="button" class="btn btn-sm p-2 border-0 bg-transparent" (click)="openModal(position)">
            <i class="bi bi-plus-square-dotted"></i>
          </button>
        </div>
      </th>
      }
    </tr>
  </thead>
  <tbody>
    <tr>
      @for (position of positionen; track position)
      {
      <td cdkDropList [id]="position" [cdkDropListData]="itemOnPosition(position)()" (cdkDropListDropped)="drop($event)"
        style="min-height: 100px;"> <!--jede td jetzt dropzone mit id -->
        @for (item of itemOnPosition(position)(); track item.id) 
        {
        <div class="item m-1 d-flex align-items-center justify-content-between" cdkDrag>

          <div class="d-flex align-items-center">
            <span cdkDragHandle style="cursor: grab;">⠿</span>
            <span>{{ item.name }}</span>
          </div>

          <div class="editButtons">
            <button type="button" class="btn border-0 bg-transparent" (click)="editItem(item)">
              <i class="bi bi-pencil"></i>
            </button>
            <button type="button" class="btn border-0 bg-transparent" (click)="deleteItem(item)">
              <i class="bi bi-trash3"></i>
            </button>
          </div>

        </div>
        }
      </td>
      }
    </tr>
  </tbody>
</table>

@if (modalOpenPosition(); as position) { <!--reagiert auf output von item-modal, dynamischer titel, erhaelt data -->
  <app-item-modal
    [titel]="(editingItemId() ? 'Item bearbeiten' : 'Neues Item') + ' (' + (position | titlecase) + ')'" 
    [filledInData]="filledInData()"
    (saved)="onModalSaved($event)" 
    (cancelled)="onModalCancelled()">
  </app-item-modal>
}
