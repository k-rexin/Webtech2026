@if(geraet(); as g) { <!--prueft ob ein geraet gefunden wurde und merkt sich namen als g-->
<div class="geraet-container text-center">
  <div class="position-relative mb-3">
    <h4 class="d-inline-block mb-0">{{ g.name }}</h4>
    <button type="button" class="btn btn-sm border-0 bg-transparent edit-btn" (click)="openEdit()">
      <i class="bi bi-pencil"></i>
    </button>
  </div>

  @if(g.geraetTyp === 'truhe'){
  <div class="tk-wrapper">
    <img src="tiefkühltruhe.png" alt="tiefkühltruhe" class="tkTruhe-bild">
    <div class="tabelle-overlay">
      <app-geraete-table [geraetId]="g.id"></app-geraete-table>
    </div>
  </div>

  }

  @if(g.geraetTyp === 'schrank') {
  <div class="schubladen-stapel">
    @for (schublade of schubladenArray(); track $index)
    {
    <div class="tk-wrapper">
      <img src="tiefkühlschublade.png" alt="tiefkühlschublade" class="tkSchublade-bild">
      <div class="tabelle-overlay">
        <app-geraete-table [geraetId]="g.id" [schubladeIndex]="$index"></app-geraete-table>
      </div>
    </div>
    }
  </div>
  }


  <div class="text-center mt-4">
    <button type="button" class="btn btn-outline-danger btn-sm" (click)="deleteGeraet()">
      Gerät löschen
    </button>
  </div>

</div>
}

@if (isEditOpen()) {
<div class="modal" style="display: block;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Gerätnamen bearbeiten</h5>
      </div>
      <form (submit)="submitEdit($event)" novalidate>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Name</label>
            <input type="text" [formField]="editForm.name" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" (click)="cancelEdit()">Abbrechen</button>
          <button type="submit" class="btn">Speichern</button>
        </div>
      </form>
    </div>
  </div>
</div>
}
