<div class="container-fluid">

    <div class="mb-3 d-flex justify-content-center">
        <input type="text" class="form-control w-50" placeholder="Suchen..."
            [value]="searchText()" (input)="searchText.set($any($event.target).value)">
        <!--input bindet an signal und nicht an ReactiveFormsModule/FormControl-->
    </div>
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Beschreibung</th>
                <th scope="col">Anzahl</th>
                <th scope="col">MHD</th>
                <th scope="col">Ort</th>
            </tr>
        </thead>
        <tbody>
            @for (item of filteredItems(); track item.name + item.ort) { <!--item.name + item.ort als ID ersatz-->
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.beschreibung }}</td>
                <td>{{ item.anzahl }}</td>
                <td>{{ item.mhd }}</td>
                <td>{{ item.ort }}</td>
            </tr>
            }
        </tbody>
    </table>
</div>
