<div class="container" id="form"> <!--container class rueckt alles ein bisschen seitlich rein-->
<h2>Neue Teilnehmerin</h2>

<div class="container-fluid">
    <div class="row p-2">
        <div class="col-3">
            Vorname
        </div>
        <div class="col-9">
            <input type="text" class="form-control" [formControl]="vornameControl" placeholder="Vorname" aria-label="Vorname">
        </div>
    </div>
    <div class="row p-2">
        <div class="col-3">
            Nachname
        </div>
        <div class="col-9">
            <input type="text" class="form-control" [formControl]="nachnameControl" placeholder="Nachname" aria-label="Nachname">
        </div>
    </div>
     <div class="row p-2">
        <div class="col-3">
            E-Mail
        </div>
        <div class="col-9">
            <input type="text" class="form-control" [formControl]="emailControl" placeholder="E-mail" aria-label="E-mail">
        </div>
    </div>
     <div class="row p-2">
        <div class="col-3">
            IP-Adresse
        </div>
        <div class="col-9">
            <input type="text" class="form-control" [formControl]="ipAdresseControl"  placeholder="IP-Adresse" aria-label="IP-Adresse">
        </div>
    </div>
    <div class="row p-2">
        <div class="col text-end">
            <button type="button" class="btn btn-success" [disabled]="!isValid()" (click)="create()" >Speichern</button>
        </div>
    </div>
</div>
</div>
