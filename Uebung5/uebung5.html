<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>Übung 5</title>
    <style>
        img {
            width: 50px;
        }
    </style>
</head>
<body class="container" onload="init()">
    <h1>Sädte</h1>
    <div class="row my-4">
        <div class="col-2">
            <label for="filter">Filter:</label>
        </div>
        <div class="col-10">
            <input type="text" class="form-control" id="filter" oninput="createTable()"/>
        </div>     
    </div>
    <table class="table table-striped table-hover align-middle">
        <thead>
            <tr>
                <th scope="col">Nr</th>
                <th scope="col">Jahr</th>
                <th scope="col">Stadt</th>
                <th scope="col">Link</th>
                <th scope="col">Bild</th>
            </tr>
        </thead>
        <tbody id="tbody">
            
        
        
        </tbody>
    </table>


    <script>
        let staedtearr = []; // hier wird array global erstellt 

        async function getStaedte() {

            const request = new Request('staedte.json', { // holt json datei
                    method: 'GET',      // GET ist default und daten von json abrufen
                    headers: { 
                        'Accept': 'application/json'
                    }
                });

            const response = await fetch(request); // request const wird zur anfrage angegeben
            console.log(response); // gibt fetch reject/resolved auf console aus
            return response.json(); // gibt resopne als json wieder
        }

        function createTable() {
            let input = document.getElementById('filter').value; // speichert eingabe

            if(staedtearr.length > 0) //falls array länger als 0
            {
                let tbody = document.getElementById('tbody'); //tbody variable
                tbody.innerHTML = ''; // leer erstellt
                let nr = 1; // counter??
                    for(let stadtObj of staedtearr) //for each obj vom array
                    { 
                        if(stadtObj.stadt.toLowerCase().substring(0, input.length) == input.toLowerCase() ||
                           stadtObj.jahr.toString().toLowerCase().substring(0, input.length) == input.toLowerCase()  ) // wenn stadt mit input anfaengt
                        {
                            tbody.innerHTML += `<tr>
                                                <td> ${nr} </td>
                                                <td> ${stadtObj.jahr} </td>
                                                <td> ${stadtObj.stadt} </td>
                                                <td> <a class="btn btn-success btn-sm" href="${stadtObj.link}">Info</a> </td>
                                                <td> <img src="${stadtObj.bild}" alt="stadt aus staedte.json"/> </td>
                                                </tr>`;
                                                nr++;
                        }
                        
                    }
        
            }
        
        }

        async function init() {
                    
            let bodyObj = await getStaedte() // ruft func auf
            console.log('responseObj', bodyObj) //gibt response.json wieder auf konsole
            staedtearr = await bodyObj.staedte; // erstellt array mit der response.json datei/ davon die staedte
            console.log('staedtearr', staedtearr) // gibt array wieder auf konsole
            createTable() //aufruf
        }

        
    </script>
</body>
</html>
