<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uebung 4</title>
    <link href="../bootstrap-5.3.8-dist/css/bootstrap.css" rel="stylesheet" />
</head>

<body class="container-fluid">
    <header>
        <h2 class="pb-2 pt-4 text-success">Teilnehmerinnen Registrierung</h3>
    </header>
    <main class="p-2">

        <form class="row g-3">
            <div class="col-6 col-md-6 col-xl-3 mb-3">
                <input type="text" class="form-control" id="validationVorname" placeholder="Vorname" required>
                <div class="invalid-feedback">
                    Bitte Vornamen eingeben.
                </div>
            </div>

            <div class="col-6 col-md-6 col-xl-3 mb-3">
                <input type="text" class="form-control" id="validationNachname" placeholder="Nachname" required>
                <div class="invalid-feedback">
                    Bitte Nachnamen eingeben.
                </div>
            </div>

            <div class="col-6 col-md-6 col-xl-3 mb-3">
                <input type="text" class="form-control" id="validationEMail" placeholder="E-Mail" required>
                <div class="invalid-feedback">
                    Bitte E-Mail eingeben.
                </div>
            </div>

            </div>
            <div class="col-6 col-md-6 col-xl-3 mb-3">
                <input type="text" class="form-control" id="validationIPAdresse" placeholder="IP-Adresse" required>
                <div class="invalid-feedback">
                    Bitte IP-Adresse eingeben.
                </div>
            </div>
        </form>

        </br>
        <button type="button" class="btn btn-secondary" onclick="loeschen()">Abbrechen</button>
        <button type="button" class="btn btn-success border-success-subtle border-3"
            onclick="wiedergabe()">Registrieren</button>

        <div id="ausgabe"></div>

        <h3 class="pb-2 pt-4">Eingegebene Werte</h3>
        <ul class="list-group" id="werteListe"></ul>



    </main>
</body>

</html>

<script>
    function wiedergabe(){
   // event.preventDefault();
    const allInputs = document.querySelectorAll('input'); //alle input-elemente als array
    console.log('allInputs: ', allInputs);
    const outputList = document.querySelector('#werteListe'); // ul mit id werteliste 
    outputList.innerHTML = "";
    
    let inputOK= true;
    for (i = 0; i < allInputs.length; i++) 
    {
        console.log((i + 1) + ". value: " + allInputs[i].value);
        if (allInputs[i].value == "") // == ist gleichheit auch von verschiedenen typen  === identisch bei gleichen typen
        {
            // keine eingbe in allInputs[i]
            inputOK = false;
            allInputs[i].classList.add('is-invalid');
            allInputs[i].classList.remove('is-valid');
        }
        else 
        {
            // Eingabe in allInputs[i]
            allInputs[i].classList.add('is-valid');
            allInputs[i].classList.remove('is-invalid');
            outputList.innerHTML += `<li class="list-group-item"> ${allInputs[i].placeholder}: ${allInputs[i].value} </li>`;
            //liste wird befüllt mit html 
        }
    }

    const headline = document.querySelector('h3');
    if(inputOK)
    {
        headline.textContent = "Eingegebene Werte"; 
        headline.style.color = "green";
        outputList.style.display = "block";
    }
    else
    {
        headline.textContent = "Bitte alle Felder ausfüllen!";
        headline.style.color = "red";
        outputList.style.display = "none"; // liste erscheint nicht 
    }
    }

    }
