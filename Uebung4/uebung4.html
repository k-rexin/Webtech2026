<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uebung 4</title>
    <link href="../bootstrap-5.3.8-dist/css/bootstrap.css" rel="stylesheet" />
</head>

<body>
    <header>
        <h2>Teilnehmerinnen Registrierung</h2>
    </header>
    <main>
        <form>
            <div class="row">
                <div class="col">
                    <input type="text" class="form-control" placeholder="First name" aria-label="First name">
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col">
                    <input type="text" class="form-control" placeholder="E-Mail" aria-label="First name">
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="IP-Address" aria-label="Last name">
                </div>
            </div>

            </br>
            <input type="checkbox" class="btn-check" id="btn-check-2-outlined" checked autocomplete="off">
            <label class="btn btn-outline-secondary" for="btn-check-2-outlined">Abbrechen</label>
            <input type="radio" class="btn-check" name="options-outlined" id="success-outlined" autocomplete="off"
                checked>
            <label class="btn btn-outline-success" for="success-outlined">Registrieren</label>
        </form>

    </main>
    <footer>

    </footer>
</body>

</html>
